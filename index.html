<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification Bot Panel</title>
<style>
  :root { --bg:#111318; --card:#1a1d24; --line:#2a2e38; --text:#e8eaf0; --muted:#8b91a1; --accent:#5865f2; --danger:#ed4245; --ok:#3ba55d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, sans-serif; padding:24px 16px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  textarea { width:100%; min-height:100px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  button.secondary { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .current { font-size:14px; margin-bottom:10px; }
  .current b { color:var(--ok); }
  audio { width:100%; margin-top:8px; }
  input[type=file] { color:var(--muted); font-size:13px; max-width:100%; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); padding:10px 18px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  #toast.err { border-color:var(--danger); color:var(--danger); }
  #toast.ok { border-color:var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Verification Bot Panel</h1>
  <p class="sub">Changes apply to the next person who joins. No restart needed.</p>

  <div class="card">
    <h2>Welcome message</h2>
    <textarea id="msg" maxlength="200"></textarea>
    <div class="row"><span>Spoken by the bot when someone joins</span><span id="count">0/200</span></div>

    <label>Welcome voice volume: <span id="wvLabel"></span></label>
    <input type="range" id="wv" min="0" max="2" step="0.05">

    <label>Music volume: <span id="mvLabel"></span></label>
    <input type="range" id="mv" min="0" max="1" step="0.05">

    <div class="actions"><button id="saveBtn">Save settings</button></div>
  </div>

  <div class="card">
    <h2>Waiting music</h2>
    <div class="current">Current: <b id="song">-</b></div>
    <audio id="player" controls preload="none"></audio>

    <label>Upload a new song (mp3, wav, ogg, m4a, flac - max 25 MB)</label>
    <input type="file" id="file" accept=".mp3,.wav,.ogg,.m4a,.flac,audio/*">
    <div class="actions">
      <button id="uploadBtn">Upload song</button>
      <button id="resetBtn" class="danger">Remove uploaded song</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(text, type) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'show ' + (type || 'ok');
  setTimeout(() => (t.className = ''), 2500);
}

function render(s) {
  $('msg').value = s.welcomeMessage;
  $('count').textContent = s.welcomeMessage.length + '/200';
  $('wv').value = s.welcomeVolume;
  $('mv').value = s.musicVolume;
  $('wvLabel').textContent = Math.round(s.welcomeVolume * 100) + '%';
  $('mvLabel').textContent = Math.round(s.musicVolume * 100) + '%';
  $('song').textContent = s.hasMusic ? s.musicName : 'No music set';
  $('player').style.display = s.hasMusic ? 'block' : 'none';
  if (s.hasMusic) $('player').src = '/api/music/file?t=' + Date.now();
}

async function api(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

$('msg').addEventListener('input', () => ($('count').textContent = $('msg').value.length + '/200'));
$('wv').addEventListener('input', () => ($('wvLabel').textContent = Math.round($('wv').value * 100) + '%'));
$('mv').addEventListener('input', () => ($('mvLabel').textContent = Math.round($('mv').value * 100) + '%'));

$('saveBtn').onclick = async () => {
  try {
    const s = await api('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        welcomeMessage: $('msg').value,
        welcomeVolume: Number($('wv').value),
        musicVolume: Number($('mv').value),
      }),
    });
    render(s);
    toast('Settings saved');
  } catch (e) { toast(e.message, 'err'); }
};

$('uploadBtn').onclick = async () => {
  const f = $('file').files[0];
  if (!f) return toast('Choose a file first', 'err');
  const form = new FormData();
  form.append('song', f);
  $('uploadBtn').textContent = 'Uploading...';
  try {
    render(await api('/api/music', { method: 'POST', body: form }));
    $('file').value = '';
    toast('Song uploaded');
  } catch (e) { toast(e.message, 'err'); }
  $('uploadBtn').textContent = 'Upload song';
};

$('resetBtn').onclick = async () => {
  if (!confirm('Remove the uploaded song?')) return;
  try { render(await api('/api/music', { method: 'DELETE' })); toast('Song removed'); }
  catch (e) { toast(e.message, 'err'); }
};

api('/api/settings').then(render).catch((e) => toast(e.message, 'err'));
</script>
</body>
</html>
